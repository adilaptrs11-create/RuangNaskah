check=function(){let typed=document.getElementById('draft').value.trim();if(!typed&&!selectedFileText){document.getElementById('result').textContent='Masukkan teks atau unggah file terlebih dahulu.';return}let parts=[];if(typed)parts.push({name:'Teks yang diketik',text:typed});if(selectedFileText){if(selectedFilePages.length){selectedFilePages.forEach((p,i)=>{if(p.trim())parts.push({name:'Lampiran: '+selectedFile.name+' — halaman '+(i+1),text:p})})}else parts.push({name:'Lampiran: '+selectedFile.name,text:selectedFileText})}let total=0,all=[];let output=parts.map(part=>{let hits=matches(part.text),pos=0,html='';total+=hits.length;all.push(...hits);for(const h of hits){html+=esc(part.text.slice(pos,h.start))+'<mark title="'+esc(h.rule[2])+'">'+esc(part.text.slice(h.start,h.end))+'</mark>';pos=h.end}html+=esc(part.text.slice(pos));return '<div class="card"><b>'+esc(part.name)+'</b><p class="muted">'+hits.length+' temuan</p><details><summary>Lihat kutipan teks dan penanda kesalahan</summary><p style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto">'+html+'</p></details></div>'}).join('');let unique=[...new Map(all.map(h=>[h.rule[0],h.rule])).values()];document.getElementById('result').innerHTML='<div class="card"><b>'+total+' temuan ('+unique.length+' jenis)</b><p class="muted">Dokumen tetap sebagai lampiran. Kutipan teks di bawah hanya untuk membantu menemukan kesalahan, bukan tampilan asli PDF/DOCX.</p></div>'+output+unique.map(row).join('')+(!total?'<div class="card">Tidak ada temuan dari database lokal. Ini bukan jaminan bahwa seluruh naskah sudah benar.</div>':'')};

async function handleNaskahFile(input){let f=input.files?.[0],status=document.getElementById('fileStatus');if(!f)return;if(f.size>10*1024*1024){status.textContent='Ukuran file melebihi 10 MB.';input.value='';return}status.textContent='Membaca '+f.name+' ...';try{let text='';let pages=[];let ext=f.name.split('.').pop().toLowerCase();if(ext==='txt'){text=await f.text()}else if(ext==='docx'){if(!window.mammoth)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});text=r.value}else if(ext==='pdf'){if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;pages=[];for(let n=1;n<=pdf.numPages;n++){let page=await pdf.getPage(n),content=await page.getTextContent();pages.push(content.items.map(x=>x.str).join(' '))}text=pages.join('\n')}else throw Error('Format belum didukung.');if(!text.trim())throw Error('Tidak ada teks yang bisa diekstraksi. PDF hasil pindai membutuhkan OCR, yang belum tersedia.');selectedFile=f;selectedFileText=text;selectedFilePages=pages;status.innerHTML='📎 '+esc(f.name)+' — siap diperiksa ('+text.length+' karakter). <button class="secondary" style="padding:5px 9px" onclick="removeNaskahFile()">Hapus lampiran</button>';document.getElementById('result').innerHTML='<div class="card">Lampiran siap. Klik <b>Periksa naskah</b> untuk memeriksa tanpa mengubah kotak teks.</div>'}catch(e){status.textContent='Gagal membaca file: '+e.message}finally{input.value=''}}

function levenshtein(a,b){if(Math.abs(a.length-b.length)>2)return 99;let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(n[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));row=n}return row[b.length]}
function wordInfo(w){let q=w.trim().toLowerCase();if(!q)return {type:'empty'};if(correctionsMap.has(q)){let r=correctionsMap.get(q);return {type:'error',word:w,fix:r[1],reason:r[2]}}if(curatedLexicon.has(q))return {type:'known',word:w,reason:taxLexicon.has(q)?'Istilah/singkatan perpajakan yang dikenali (konteks tetap perlu diperiksa).':'Dikenali dalam daftar lokal; bukan validasi menyeluruh KBBI.'};let candidates=[...curatedLexicon].filter(x=>x.length>3&&Math.abs(x.length-q.length)<=1&&x[0]===q[0]).map(x=>({w:x,d:levenshtein(q,x)})).filter(x=>x.d<=1).sort((a,b)=>a.d-b.d).slice(0,3).map(x=>x.w);return {type:'unknown',word:w,candidates,reason:'Belum ada dalam daftar lokal; tidak otomatis berarti tidak baku.'}}

<script>
/* RUANG NASKAH 4.9 — hasil ringkas, tanpa salinan dokumen atau tebakan salah ketik. */
function check(){
  const draft=document.getElementById('draft');
  const typed=(draft?.value||'').trim();
  const result=document.getElementById('result');
  if(!typed&&!selectedFileText){result.textContent='Masukkan teks atau unggah file terlebih dahulu.';return}
  const parts=[];
  if(typed)parts.push({name:'Teks yang diketik',text:typed});
  if(selectedFileText){
    if(selectedFilePages.length){selectedFilePages.forEach((p,i)=>{if(p.trim())parts.push({name:'Lampiran: '+selectedFile.name+' — halaman '+(i+1),text:p})})}
    else parts.push({name:'Lampiran: '+selectedFile.name,text:selectedFileText});
  }
  let total=0;
  const groups=parts.map(part=>{
    const hits=matches(part.text);
    total+=hits.length;
    const grouped=[...new Map(hits.map(h=>[h.rule[0].toLowerCase(),h.rule])).values()];
    const items=grouped.length?grouped.map(r=>`<div style="padding:12px 0;border-top:1px solid #e4eaf1"><div><span class="bad">${esc(r[0])}</span> <span aria-hidden="true">→</span> <b class="good">${esc(r[1])}</b></div><p class="muted" style="margin:5px 0 0">${esc(r[2])}</p></div>`).join(''):'<p class="muted" style="margin:10px 0 0">Tidak ditemukan kesalahan berdasarkan aturan pemeriksaan yang tersedia.</p>';
    return `<section class="card"><b>${esc(part.name)}</b><p class="muted" style="margin:6px 0 12px">${hits.length} temuan aturan${grouped.length?' · '+grouped.length+' jenis perbaikan':''}</p>${items}</section>`;
  }).join('');
  result.innerHTML=`<div class="card"><h3 style="margin:0 0 8px">Hasil Pemeriksaan Naskah</h3><p style="margin:0"><b>${total} temuan berdasarkan aturan</b></p><p class="muted" style="margin:8px 0 0">Dokumen diperiksa tanpa menampilkan ulang isi naskah. Hasil ini merupakan pemeriksaan awal dan tetap memerlukan peninjauan pegawai.</p></div>`+groups;
}

</script>
